[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamy-ai-starter"
version = "0.2.0"
description = "Replay-first game decision research and evaluation framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - project license to be decided"}
dependencies = []

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
training = ["numpy>=1.24", "torch>=2.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]